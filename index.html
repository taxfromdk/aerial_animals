<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aerial Animals — Image Gallery</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --panel-hover: #262a32;
    --accent: #4da3ff;
    --text: #e8eaed;
    --text-dim: #9aa0a8;
    --border: #2c3038;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  #header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  #crumbs { display: flex; align-items: center; gap: 4px; font-size: 15px; flex-wrap: wrap; }
  #crumbs a {
    color: var(--accent);
    text-decoration: none;
    padding: 4px 8px;
    border-radius: 6px;
  }
  #crumbs a:hover { background: var(--panel-hover); }
  #crumbs .sep { color: var(--text-dim); }
  #crumbs .here { font-weight: 600; padding: 4px 8px; }
  #stats { margin-left: auto; color: var(--text-dim); font-size: 12px; text-align: right; }
  #repo-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    white-space: nowrap;
  }
  #repo-link:hover { background: var(--panel-hover); border-color: var(--accent); }

  /* ---------- Toolbar (grid view only) ---------- */
  #toolbar {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  #toolbar[hidden] { display: none; }
  button, select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover:not(:disabled), select:hover { background: var(--panel-hover); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  #page-info { color: var(--text-dim); font-size: 12px; min-width: 100px; text-align: center; }
  #toolbar .spacer { flex: 1; }
  #toolbar .hint { color: var(--text-dim); font-size: 12px; }

  /* ---------- Content ---------- */
  #content { flex: 1; overflow-y: auto; padding: 20px; }

  .notice {
    color: var(--text-dim);
    text-align: center;
    padding: 60px 20px;
  }
  .notice code { color: var(--text); background: var(--panel); padding: 2px 6px; border-radius: 4px; }

  /* Intro (home view) */
  .intro {
    max-width: 720px;
    margin: 0 auto 28px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .intro .banner { display: block; width: 100%; height: auto; }
  .intro .body { padding: 22px 26px; }
  .intro h1 { font-size: 20px; margin-bottom: 10px; }
  .intro p { color: var(--text-dim); margin-bottom: 10px; }
  .intro p:last-child { margin-bottom: 0; }
  .intro strong { color: var(--text); font-weight: 600; }

  /* Folder cards (drill-down view) */
  #content .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .card:hover { background: var(--panel-hover); border-color: var(--accent); }
  .card .icon { font-size: 28px; }
  .card .title { font-size: 15px; font-weight: 600; }
  .card .sub { color: var(--text-dim); font-size: 12px; margin-top: 2px; }

  /* Image tiles */
  #content .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 12px;
  }
  .tile {
    position: relative;
    aspect-ratio: 4 / 3;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    padding: 8px;
  }
  .tile:hover { border-color: var(--accent); }
  .tile .icon { font-size: 26px; opacity: .7; }
  .tile .fname { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .fsize { font-size: 11px; opacity: .7; }
  .tile .hover-hint { font-size: 11px; color: var(--accent); opacity: 0; transition: opacity .15s; }
  .tile:hover .hover-hint { opacity: 1; }
  .tile img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .2s;
  }
  .tile.loaded img { opacity: 1; }
  .tile.loaded .icon, .tile.loaded .fsize, .tile.loaded .hover-hint { display: none; }
  .tile.loaded .fname {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    max-width: none;
    padding: 3px 8px;
    color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,.75));
    z-index: 1;
  }
  .tile.error .icon::after { content: " ⚠"; }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tile .spinner { display: none; }
  .tile.loading .spinner { display: block; }
  .tile.loading .icon, .tile.loading .hover-hint { display: none; }

  /* ---------- Viewer ---------- */
  #viewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.93);
    display: none;
    flex-direction: column;
    z-index: 10;
  }
  #viewer.open { display: flex; }
  #viewer .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 16px;
    overflow: hidden;
    touch-action: none;
    position: relative;
  }
  #viewer img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    cursor: zoom-in;
    user-select: none;
    -webkit-user-drag: none;
  }
  #viewer.zoomed img { cursor: grab; }
  #viewer.zoomed img.dragging { cursor: grabbing; }
  #viewer .stage .spinner { position: absolute; width: 32px; height: 32px; display: none; }
  #viewer.busy .stage .spinner { display: block; }
  .navzone {
    position: absolute;
    top: 0; bottom: 48px;
    width: 22%;
    cursor: pointer;
    display: flex;
    align-items: center;
    color: transparent;
    font-size: 48px;
    user-select: none;
  }
  .navzone:hover { color: rgba(255,255,255,.6); }
  #nav-prev { left: 0; justify-content: flex-start; padding-left: 20px; }
  #nav-next { right: 0; justify-content: flex-end; padding-right: 20px; }
  #viewer.zoomed .navzone { display: none; }
  #viewer .bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    color: var(--text-dim);
    font-size: 13px;
  }
  #viewer .bar .title { color: var(--text); }
  #viewer .bar .spacer { flex: 1; }
</style>
</head>
<body>

<div id="header">
  <div id="crumbs"></div>
  <div id="stats">Loading index…</div>
  <a id="repo-link" href="https://github.com/taxfromdk/aerial_animals">View on GitHub ↗</a>
</div>

<div id="toolbar" hidden>
  <button id="page-prev">‹ Prev</button>
  <span id="page-info">—</span>
  <button id="page-next">Next ›</button>
  <label>Per page
    <select id="page-size">
      <option>12</option>
      <option selected>24</option>
      <option>48</option>
      <option>96</option>
    </select>
  </label>
  <button id="load-page" class="primary">Load previews on this page</button>
  <div class="spacer"></div>
  <span class="hint">Hover a tile to load its preview · click to view full size</span>
</div>

<div id="content"></div>

<div id="viewer">
  <div class="stage">
    <div class="spinner"></div>
    <img id="v-img" alt="">
  </div>
  <div id="nav-prev" class="navzone">‹</div>
  <div id="nav-next" class="navzone">›</div>
  <div class="bar">
    <span class="title" id="v-title"></span>
    <span id="v-pos"></span>
    <span id="v-zoom"></span>
    <a id="v-orig" href="#" target="_blank" style="color:var(--accent);text-decoration:none">original ↗</a>
    <div class="spacer"></div>
    <span id="v-hint"></span>
    <button id="v-close">Close</button>
  </div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

/* =============================================================
   State
   ============================================================= */
const state = {
  tree: null,        // root tree node
  index: null,       // parsed index.json
  node: null,        // current tree node being viewed
  page: 0,
  pageSize: 24,
  viewerIdx: -1,     // index into current folder's images, -1 = closed
  thumbBase: null,   // set on the published site (CI-built thumbnails)
  sourceBase: null,  // set on the published site (raw git URLs for originals)
};

/* =============================================================
   "Already fetched" memory — URLs loaded this browser, so we can
   show them immediately (the browser cache serves them for free).
   ============================================================= */
const LOADED_KEY = "gallery-loaded-v1";
const loadedSet = new Set(JSON.parse(localStorage.getItem(LOADED_KEY) || "[]"));

function markLoaded(url) {
  if (loadedSet.has(url)) return;
  loadedSet.add(url);
  const all = [...loadedSet];
  // keep the memory bounded; drop oldest entries first
  localStorage.setItem(LOADED_KEY, JSON.stringify(all.slice(-5000)));
}

/* =============================================================
   Polite loader — at most N image requests in flight at a time,
   so the server is never hammered even by "load page".
   ============================================================= */
const MAX_CONCURRENT = 3;
const loadQueue = [];
let inFlight = 0;

function queueLoad(url, onDone, onError) {
  loadQueue.push({ url, onDone, onError });
  pumpQueue();
}

function pumpQueue() {
  while (inFlight < MAX_CONCURRENT && loadQueue.length) {
    const job = loadQueue.shift();
    inFlight++;
    const img = new Image();
    img.onload = () => { inFlight--; markLoaded(job.url); job.onDone(job.url); pumpQueue(); };
    img.onerror = () => { inFlight--; if (job.onError) job.onError(); pumpQueue(); };
    img.src = job.url;
  }
}

/* =============================================================
   Index & folder tree
   ============================================================= */
function encPath(folder, name) {
  const dir = folder.path === "" ? "" : folder.path.split("/").map(encodeURIComponent).join("/") + "/";
  return dir + encodeURIComponent(name);
}

/* Grid previews: small thumbnails on the published site, originals locally */
function thumbUrl(folder, name) {
  return state.thumbBase ? state.thumbBase + encPath(folder, name) + ".jpg" : encPath(folder, name);
}

/* Full-size viewer: raw files from the git repo on the published site */
function fullUrl(folder, name) {
  return state.sourceBase ? state.sourceBase + encPath(folder, name) : encPath(folder, name);
}

function buildTree(index) {
  const root = { name: "Home", parent: null, children: new Map(), folder: null, count: 0, path: [] };
  for (const f of index.folders) {
    const parts = f.path === "" ? [] : f.path.split("/");
    let node = root;
    root.count += f.count;
    for (const part of parts) {
      if (!node.children.has(part)) {
        node.children.set(part, {
          name: part, parent: node, children: new Map(),
          folder: null, count: 0, path: [...node.path, part],
        });
      }
      node = node.children.get(part);
      node.count += f.count;
    }
    node.folder = f;
  }
  return root;
}

function findNode(pathParts) {
  let node = state.tree;
  for (const part of pathParts) {
    node = node.children.get(part);
    if (!node) return state.tree;
  }
  return node;
}

/* =============================================================
   Navigation (hash-based, so back/forward buttons work)
   ============================================================= */
function navigate(node) {
  location.hash = "/" + node.path.map(encodeURIComponent).join("/");
}

function onHashChange() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  state.node = findNode(parts);
  state.page = 0;
  closeViewer();
  render();
}

/* =============================================================
   Rendering
   ============================================================= */
function render() {
  renderCrumbs();
  const node = state.node;
  if (node.children.size > 0) {
    $("toolbar").hidden = true;
    renderCards(node);
  } else if (node.folder) {
    $("toolbar").hidden = false;
    renderGrid(node.folder);
  } else {
    $("toolbar").hidden = true;
    $("content").innerHTML = `<div class="notice">This folder is empty.</div>`;
  }
}

function renderCrumbs() {
  const crumbs = $("crumbs");
  crumbs.innerHTML = "";
  const chain = [];
  for (let n = state.node; n; n = n.parent) chain.unshift(n);
  chain.forEach((n, i) => {
    if (i > 0) {
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = "›";
      crumbs.appendChild(sep);
    }
    if (n === state.node) {
      const here = document.createElement("span");
      here.className = "here";
      here.textContent = n.name;
      crumbs.appendChild(here);
    } else {
      const a = document.createElement("a");
      a.href = "#/" + n.path.map(encodeURIComponent).join("/");
      a.textContent = n.name;
      crumbs.appendChild(a);
    }
  });
}

const INTRO_HTML = `
  <img class="banner" src="fake_elephant.jpg" alt="Aerial view of an elephant">
  <div class="body">
  <h1>Aerial Animals — a shared dataset in the making</h1>
  <p>Aerial images of animals, collected by student teams and pooled across
     <strong>years</strong> and <strong>teams</strong>. The idea is simple: instead of every
     team starting from zero, browse what earlier teams captured, get a feel for what this
     data really looks like — lighting, altitude, how small the animals are — and use that
     to build more interesting detectors.</p>
  <p>Pick a year below, then a team and a capture session, to browse the raw images.
     Previews load only when you hover them, so feel free to explore.</p>
  <p>Contributions of new capture folders are welcome — see the
     <a href="https://github.com/taxfromdk/aerial_animals" style="color:var(--accent)">repository</a>
     for how.</p>
  </div>`;

function renderCards(node) {
  const frag = document.createDocumentFragment();
  if (!node.parent) {
    const intro = document.createElement("div");
    intro.className = "intro";
    intro.innerHTML = INTRO_HTML;
    frag.appendChild(intro);
  }
  const wrap = document.createElement("div");
  wrap.className = "cards";
  for (const child of node.children.values()) {
    const card = document.createElement("div");
    card.className = "card";
    const isLeaf = child.children.size === 0;
    const sub = isLeaf
      ? `${child.count} images`
      : `${child.children.size} folders · ${child.count} images`;
    card.innerHTML = `<div class="icon"></div><div><div class="title"></div><div class="sub"></div></div>`;
    card.querySelector(".icon").textContent = isLeaf ? "🖼️" : "📁";
    card.querySelector(".title").textContent = child.name;
    card.querySelector(".sub").textContent = sub;
    card.onclick = () => navigate(child);
    wrap.appendChild(card);
  }
  frag.appendChild(wrap);
  $("content").replaceChildren(frag);
  $("content").scrollTop = 0;
}

function formatSize(bytes) {
  if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
  if (bytes >= 1024) return Math.round(bytes / 1024) + " KB";
  return bytes + " B";
}

const HOVER_DELAY_MS = 200;

function makeTile(folder, image, absoluteIdx) {
  const url = thumbUrl(folder, image.name);
  const tile = document.createElement("div");
  tile.className = "tile";
  tile.innerHTML = `
    <div class="icon">🖼️</div>
    <div class="spinner"></div>
    <div class="fname"></div>
    <div class="fsize"></div>
    <div class="hover-hint">hover to preview</div>`;
  tile.querySelector(".fname").textContent = image.name;
  tile.querySelector(".fsize").textContent = formatSize(image.size);

  let started = false;
  const startLoad = () => {
    if (started) return;
    started = true;
    tile.classList.add("loading");
    queueLoad(url,
      () => {
        const img = document.createElement("img");
        img.src = url;          // instant: just fetched, served from cache
        img.alt = image.name;
        tile.prepend(img);
        tile.classList.remove("loading");
        tile.classList.add("loaded");
      },
      () => {
        tile.classList.remove("loading");
        tile.classList.add("error");
        started = false;        // allow retry on next hover
      });
  };
  tile.dataset.load = "";       // marker for the "load page" button
  tile._startLoad = startLoad;

  if (state.thumbBase || loadedSet.has(url)) {
    // thumbnails are tiny — load them all (still throttled by the queue);
    // hover-loading is only for local browsing where tiles are the originals
    startLoad();
  } else {
    let timer = null;
    tile.addEventListener("mouseenter", () => {
      if (!started) timer = setTimeout(startLoad, HOVER_DELAY_MS);
    });
    tile.addEventListener("mouseleave", () => clearTimeout(timer));
  }

  tile.onclick = () => openViewer(absoluteIdx);
  return tile;
}

function pageCount(folder) {
  return Math.max(1, Math.ceil(folder.images.length / state.pageSize));
}

function renderGrid(folder) {
  const grid = document.createElement("div");
  grid.className = "grid";
  const start = state.page * state.pageSize;
  const slice = folder.images.slice(start, start + state.pageSize);
  slice.forEach((image, i) => grid.appendChild(makeTile(folder, image, start + i)));
  $("content").replaceChildren(grid);
  $("content").scrollTop = 0;

  $("page-info").textContent =
    `${start + 1}–${Math.min(start + state.pageSize, folder.images.length)} of ${folder.images.length}`;
  $("page-prev").disabled = state.page === 0;
  $("page-next").disabled = state.page >= pageCount(folder) - 1;
}

function setPage(p) {
  const folder = state.node.folder;
  if (!folder) return;
  const clamped = Math.min(Math.max(p, 0), pageCount(folder) - 1);
  if (clamped === state.page) return;
  state.page = clamped;
  renderGrid(folder);
}

$("page-prev").onclick = () => setPage(state.page - 1);
$("page-next").onclick = () => setPage(state.page + 1);
$("page-size").onchange = e => {
  const firstVisible = state.page * state.pageSize;
  state.pageSize = parseInt(e.target.value, 10);
  state.page = Math.floor(firstVisible / state.pageSize);
  if (state.node.folder) renderGrid(state.node.folder);
};
$("load-page").onclick = () => {
  document.querySelectorAll(".tile[data-load]").forEach(t => t._startLoad());
};

/* =============================================================
   Viewer (full-size, zoom & pan)
   ============================================================= */
const vImg = $("v-img");
const vStage = document.querySelector("#viewer .stage");
let zoom = 1, panX = 0, panY = 0;
const MIN_ZOOM = 1, MAX_ZOOM = 12, PAN_STEP = 120;

function openViewer(idx) {
  state.viewerIdx = idx;
  $("viewer").classList.add("open");
  showViewerImage();
}

function closeViewer() {
  resetZoom();
  $("viewer").classList.remove("open");
  vImg.removeAttribute("src");
  state.viewerIdx = -1;
}

function showViewerImage() {
  const folder = state.node.folder;
  const image = folder.images[state.viewerIdx];
  const url = fullUrl(folder, image.name);
  resetZoom();
  $("viewer").classList.add("busy");
  vImg.removeAttribute("src");
  vImg.onload = () => {
    $("viewer").classList.remove("busy");
    markLoaded(url);
    // reflect it in the grid if that tile is on screen as a placeholder
    document.querySelectorAll(".tile[data-load]:not(.loaded)").forEach(t => {
      if (t.querySelector(".fname").textContent === image.name) t._startLoad();
    });
  };
  vImg.src = url;
  $("v-orig").href = url;
  $("v-title").textContent = (folder.path ? folder.path + "/" : "") + image.name;
  $("v-pos").textContent = `${state.viewerIdx + 1} / ${folder.images.length} · ${formatSize(image.size)}`;
}

function stepViewer(delta) {
  if (state.viewerIdx < 0) return;
  const n = state.node.folder.images.length;
  state.viewerIdx = (state.viewerIdx + delta + n) % n;
  showViewerImage();
  const vPage = Math.floor(state.viewerIdx / state.pageSize);
  if (vPage !== state.page) {
    state.page = vPage;
    renderGrid(state.node.folder);
  }
}

/* ----- zoom & pan ----- */
function applyTransform() {
  vImg.style.transform = zoom === 1 ? "" : `translate(${panX}px, ${panY}px) scale(${zoom})`;
  $("viewer").classList.toggle("zoomed", zoom > 1);
  $("v-zoom").textContent = zoom > 1 ? `${zoom.toFixed(1)}×` : "";
  $("v-hint").textContent = zoom > 1
    ? "drag/arrows pan · scroll zoom · 0 fit · PgUp PgDn navigate · Esc fit"
    : "← → navigate · scroll/double-click zoom · Esc close";
}

function clampPan() {
  const maxX = Math.max(0, (vImg.clientWidth * zoom - vStage.clientWidth) / 2) + 40;
  const maxY = Math.max(0, (vImg.clientHeight * zoom - vStage.clientHeight) / 2) + 40;
  panX = Math.min(Math.max(panX, -maxX), maxX);
  panY = Math.min(Math.max(panY, -maxY), maxY);
}

function resetZoom() {
  zoom = 1; panX = 0; panY = 0;
  applyTransform();
}

function setZoom(newZoom, cx = 0, cy = 0) {
  newZoom = Math.min(Math.max(newZoom, MIN_ZOOM), MAX_ZOOM);
  if (newZoom === 1) return resetZoom();
  panX = cx - (cx - panX) * (newZoom / zoom);
  panY = cy - (cy - panY) * (newZoom / zoom);
  zoom = newZoom;
  clampPan();
  applyTransform();
}

function stageCoords(e) {
  const r = vStage.getBoundingClientRect();
  return [e.clientX - r.left - r.width / 2, e.clientY - r.top - r.height / 2];
}

vStage.addEventListener("wheel", e => {
  e.preventDefault();
  setZoom(zoom * (e.deltaY < 0 ? 1.25 : 0.8), ...stageCoords(e));
}, { passive: false });

vImg.addEventListener("dblclick", e => setZoom(zoom > 1 ? 1 : 3, ...stageCoords(e)));

let dragging = false, dragX = 0, dragY = 0;
vImg.addEventListener("pointerdown", e => {
  if (zoom === 1) return;
  dragging = true;
  dragX = e.clientX;
  dragY = e.clientY;
  vImg.classList.add("dragging");
  vImg.setPointerCapture(e.pointerId);
});
vImg.addEventListener("pointermove", e => {
  if (!dragging) return;
  panX += e.clientX - dragX;
  panY += e.clientY - dragY;
  dragX = e.clientX;
  dragY = e.clientY;
  clampPan();
  applyTransform();
});
vImg.addEventListener("pointerup", e => {
  dragging = false;
  vImg.classList.remove("dragging");
  vImg.releasePointerCapture(e.pointerId);
});

$("v-close").onclick = closeViewer;
$("nav-prev").onclick = () => stepViewer(-1);
$("nav-next").onclick = () => stepViewer(1);
vStage.onclick = e => { if (e.target !== vImg) closeViewer(); };

/* =============================================================
   Keyboard
   ============================================================= */
document.addEventListener("keydown", e => {
  if (state.viewerIdx >= 0) {
    if (e.key === "+" || e.key === "=") return setZoom(zoom * 1.25);
    if (e.key === "-") return setZoom(zoom * 0.8);
    if (e.key === "0") return resetZoom();
    if (e.key === "PageUp") { e.preventDefault(); return stepViewer(-1); }
    if (e.key === "PageDown") { e.preventDefault(); return stepViewer(1); }
    if (e.key === "Escape") return zoom > 1 ? resetZoom() : closeViewer();
    if (zoom > 1) {
      const pan = { ArrowLeft: [PAN_STEP, 0], ArrowRight: [-PAN_STEP, 0],
                    ArrowUp: [0, PAN_STEP], ArrowDown: [0, -PAN_STEP] }[e.key];
      if (pan) {
        e.preventDefault();
        panX += pan[0];
        panY += pan[1];
        clampPan();
        applyTransform();
      }
    } else {
      if (e.key === "ArrowLeft") stepViewer(-1);
      else if (e.key === "ArrowRight") stepViewer(1);
    }
  } else if (state.node) {
    if (e.key === "ArrowLeft" || e.key === "PageUp") setPage(state.page - 1);
    else if (e.key === "ArrowRight" || e.key === "PageDown") setPage(state.page + 1);
    else if ((e.key === "Backspace" || e.key === "Escape") && state.node.parent) {
      navigate(state.node.parent);
    }
  }
});

/* =============================================================
   Boot
   ============================================================= */
fetch("index.json", { cache: "no-store" })
  .then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  })
  .then(index => {
    state.index = index;
    state.thumbBase = index.thumb_base || null;
    state.sourceBase = index.source_base || null;
    if (state.thumbBase) {
      $("load-page").hidden = true;
      document.querySelector("#toolbar .hint").textContent = "Click an image to view full size";
    }
    state.tree = buildTree(index);
    const generated = new Date(index.generated).toLocaleString();
    $("stats").textContent =
      `${index.total_images} images · ${index.total_folders} folders · indexed ${generated}`;
    window.addEventListener("hashchange", onHashChange);
    onHashChange();
  })
  .catch(() => {
    $("stats").textContent = "index.json not found";
    $("content").innerHTML = `<div class="notice">Could not load <code>index.json</code>.<br><br>
      Generate it and serve the gallery with:<br><br><code>python3 run_index.py --serve</code></div>`;
  });
</script>
</body>
</html>
