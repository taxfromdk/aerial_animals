<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aerial Animals — Image Gallery</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --panel-hover: #262a32;
    --accent: #4da3ff;
    --text: #e8eaed;
    --text-dim: #9aa0a8;
    --border: #2c3038;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  #header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  #crumbs { display: flex; align-items: center; gap: 4px; font-size: 15px; flex-wrap: wrap; }
  #crumbs a {
    color: var(--accent);
    text-decoration: none;
    padding: 4px 8px;
    border-radius: 6px;
  }
  #crumbs a:hover { background: var(--panel-hover); }
  #crumbs .sep { color: var(--text-dim); }
  #crumbs .here { font-weight: 600; padding: 4px 8px; }
  #stats { margin-left: auto; color: var(--text-dim); font-size: 12px; text-align: right; }
  #repo-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    white-space: nowrap;
  }
  #repo-link:hover { background: var(--panel-hover); border-color: var(--accent); }

  /* ---------- Toolbar (grid view only) ---------- */
  #toolbar {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  #toolbar[hidden] { display: none; }
  button, select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover:not(:disabled), select:hover { background: var(--panel-hover); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  #page-info { color: var(--text-dim); font-size: 12px; min-width: 100px; text-align: center; }
  #toolbar .spacer { flex: 1; }
  #toolbar .hint { color: var(--text-dim); font-size: 12px; }

  /* ---------- Content ---------- */
  #content { flex: 1; overflow-y: auto; padding: 20px; }

  .notice {
    color: var(--text-dim);
    text-align: center;
    padding: 60px 20px;
  }
  .notice code { color: var(--text); background: var(--panel); padding: 2px 6px; border-radius: 4px; }

  /* Intro (home view) */
  .intro {
    max-width: 720px;
    margin: 0 auto 28px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .intro .banner { display: block; width: 100%; height: auto; }
  .intro .body { padding: 22px 26px; }
  .intro h1 { font-size: 20px; margin-bottom: 10px; }
  .intro p { color: var(--text-dim); margin-bottom: 10px; }
  .intro p:last-child { margin-bottom: 0; }
  .intro strong { color: var(--text); font-weight: 600; }

  /* Folder cards (drill-down view) */
  #content .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .card:hover { background: var(--panel-hover); border-color: var(--accent); }
  .card .icon { font-size: 28px; }
  .card .title { font-size: 15px; font-weight: 600; }
  .card .sub { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .card .body { flex: 1; min-width: 0; }
  .prog {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }
  .prog > div { height: 100%; background: #4caf50; }

  /* Image tiles */
  #content .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 12px;
  }
  .tile {
    position: relative;
    aspect-ratio: 4 / 3;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    padding: 8px;
  }
  .tile:hover { border-color: var(--accent); }
  /* annotation status: green = has boxes, blue = reviewed empty,
     dashed = draft in this browser (not committed yet) */
  .tile.ann-boxes, .tile.ann-boxes:hover { border: 2px solid #4caf50; }
  .tile.ann-empty, .tile.ann-empty:hover { border: 2px solid var(--accent); }
  .tile.ann-draft { border-style: dashed; }
  .tile.ann-conflict { border-width: 4px; }   /* draft shadows a committed file */
  .tile.ann-boxes:hover, .tile.ann-empty:hover { filter: brightness(1.15); }
  .tile .icon { font-size: 26px; opacity: .7; }
  .tile .fname { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .fsize { font-size: 11px; opacity: .7; }
  .tile .hover-hint { font-size: 11px; color: var(--accent); opacity: 0; transition: opacity .15s; }
  .tile:hover .hover-hint { opacity: 1; }
  .tile img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .2s;
  }
  .tile.loaded img { opacity: 1; }
  .tile.loaded .icon, .tile.loaded .fsize, .tile.loaded .hover-hint { display: none; }
  .tile.loaded .fname {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    max-width: none;
    padding: 3px 8px;
    color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,.75));
    z-index: 1;
  }
  .tile.error .icon::after { content: " ⚠"; }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tile .spinner { display: none; }
  .tile.loading .spinner { display: block; }
  .tile.loading .icon, .tile.loading .hover-hint { display: none; }

  /* ---------- Viewer ---------- */
  #viewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.93);
    display: none;
    flex-direction: column;
    z-index: 10;
  }
  #viewer.open { display: flex; }
  #viewer .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 16px;
    overflow: hidden;
    touch-action: none;
    position: relative;
  }
  #viewer img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    cursor: zoom-in;
    user-select: none;
    -webkit-user-drag: none;
  }
  #viewer .stage .spinner { position: absolute; width: 32px; height: 32px; display: none; }
  #viewer.busy .stage .spinner { display: block; }
  #viewer .bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    color: var(--text-dim);
    font-size: 13px;
  }
  #viewer .bar .title { color: var(--text); }
  #viewer .bar .spacer { flex: 1; }

  /* ---------- Annotation ---------- */
  #v-overlay {
    position: absolute;
    overflow: visible;
    pointer-events: auto;
    cursor: crosshair;
  }
  #ann-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--text-dim);
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #ann-bar #ann-status { color: var(--text); }
  #ann-bar button.active { border-color: var(--accent); color: var(--accent); }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--panel-hover);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2px 6px 2px 10px;
    cursor: pointer;
    color: var(--text);
  }
  .chip.selected { border-color: var(--accent); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip .x {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 0 4px;
    font-size: 12px;
  }
  .chip .x:hover { color: #fff; }
  .tile .badge {
    position: absolute;
    top: 6px; right: 6px;
    z-index: 2;
    background: rgba(0,0,0,.65);
    color: #fff;
    font-size: 11px;
    padding: 1px 8px;
    border-radius: 10px;
  }
</style>
</head>
<body>

<div id="header">
  <div id="crumbs"></div>
  <div id="stats">Loading index…</div>
  <a id="repo-link" href="https://github.com/taxfromdk/aerial_animals">View on GitHub ↗</a>
</div>

<div id="toolbar" hidden>
  <button id="page-prev">‹ Prev</button>
  <span id="page-info">—</span>
  <button id="page-next">Next ›</button>
  <label>Per page
    <select id="page-size">
      <option>12</option>
      <option selected>24</option>
      <option>48</option>
      <option>96</option>
    </select>
  </label>
  <button id="load-page" class="primary">Load previews on this page</button>
  <span class="hint" id="coverage"></span>
  <div class="spacer"></div>
  <span class="hint">border: <span style="color:#4caf50">green</span> = animals ·
    <span style="color:var(--accent)">blue</span> = empty · dashed = draft · thick = draft over repo</span>
  <span class="hint" id="draft-info"></span>
  <button id="dl-zip" hidden>Download annotations</button>
  <button id="clear-drafts" hidden>Discard all drafts</button>
  <span class="hint">Hover a tile to load its preview · click to view full size</span>
</div>

<div id="content"></div>

<div id="viewer">
  <div class="stage">
    <div class="spinner"></div>
    <img id="v-img" alt="">
    <svg id="v-overlay" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div id="ann-bar">
    <span>Annotations:</span>
    <span id="ann-status">none</span>
    <span id="ann-chips"></span>
    <span class="spacer" style="flex:1"></span>
    <span id="ann-hint">drag to draw · drag a box to move · Del removes · Space = empty + next</span>
    <button id="v-empty">Mark empty (Space)</button>
    <button id="v-discard" hidden>Discard draft</button>
  </div>
  <div class="bar">
    <span class="title" id="v-title"></span>
    <button id="v-prev">‹ Prev</button>
    <span id="v-pos"></span>
    <button id="v-next">Next ›</button>
    <span id="v-zoom"></span>
    <a id="v-orig" href="#" target="_blank" style="color:var(--accent);text-decoration:none">original ↗</a>
    <button id="v-share">Copy link</button>
    <div class="spacer"></div>
    <span id="v-hint"></span>
    <button id="v-close">Close</button>
  </div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

/* =============================================================
   State
   ============================================================= */
const state = {
  tree: null,        // root tree node
  index: null,       // parsed index.json
  node: null,        // current tree node being viewed
  page: 0,
  pageSize: 24,
  viewerIdx: -1,     // index into current folder's images, -1 = closed
  thumbBase: null,   // set on the published site (CI-built thumbnails)
  sourceBase: null,  // set on the published site (raw git URLs for originals)
};

/* =============================================================
   "Already fetched" memory — URLs loaded this browser, so we can
   show them immediately (the browser cache serves them for free).
   ============================================================= */
const LOADED_KEY = "gallery-loaded-v1";
const loadedSet = new Set(JSON.parse(localStorage.getItem(LOADED_KEY) || "[]"));

function markLoaded(url) {
  if (loadedSet.has(url)) return;
  loadedSet.add(url);
  const all = [...loadedSet];
  // keep the memory bounded; drop oldest entries first
  localStorage.setItem(LOADED_KEY, JSON.stringify(all.slice(-5000)));
}

/* =============================================================
   Polite loader — at most N image requests in flight at a time,
   so the server is never hammered even by "load page".
   ============================================================= */
const MAX_CONCURRENT = 3;
const loadQueue = [];
let inFlight = 0;

function queueLoad(url, onDone, onError) {
  loadQueue.push({ url, onDone, onError });
  pumpQueue();
}

function pumpQueue() {
  while (inFlight < MAX_CONCURRENT && loadQueue.length) {
    const job = loadQueue.shift();
    inFlight++;
    const img = new Image();
    img.onload = () => { inFlight--; markLoaded(job.url); job.onDone(job.url); pumpQueue(); };
    img.onerror = () => { inFlight--; if (job.onError) job.onError(); pumpQueue(); };
    img.src = job.url;
  }
}

/* =============================================================
   Index & folder tree
   ============================================================= */
function encPath(folder, name) {
  const dir = folder.path === "" ? "" : folder.path.split("/").map(encodeURIComponent).join("/") + "/";
  return dir + encodeURIComponent(name);
}

/* Grid previews: small thumbnails on the published site, originals locally */
function thumbUrl(folder, name) {
  return state.thumbBase ? state.thumbBase + encPath(folder, name) + ".jpg" : encPath(folder, name);
}

/* Full-size viewer: raw files from the git repo on the published site */
function fullUrl(folder, name) {
  return state.sourceBase ? state.sourceBase + encPath(folder, name) : encPath(folder, name);
}

function folderStats(f) {
  let annotated = 0, boxes = 0, empty = 0;
  for (const im of f.images) {
    if (im.ann !== undefined) {
      annotated++;
      const n = Number(im.ann);
      boxes += n;
      if (n === 0) empty++;
    }
  }
  return { annotated, boxes, empty };
}

function buildTree(index) {
  const root = { name: "Home", parent: null, children: new Map(), folder: null,
                 count: 0, annotated: 0, boxes: 0, empty: 0, path: [] };
  for (const f of index.folders) {
    const parts = f.path === "" ? [] : f.path.split("/");
    const stats = folderStats(f);
    let node = root;
    for (const part of [null, ...parts]) {        // null = root itself
      if (part !== null) {
        if (!node.children.has(part)) {
          node.children.set(part, {
            name: part, parent: node, children: new Map(), folder: null,
            count: 0, annotated: 0, boxes: 0, empty: 0, path: [...node.path, part],
          });
        }
        node = node.children.get(part);
      }
      node.count += f.count;
      node.annotated += stats.annotated;
      node.boxes += stats.boxes;
      node.empty += stats.empty;
    }
    node.folder = f;
  }
  return root;
}

/* drafts in this browser touching images under the given node */
function draftCountFor(node) {
  const prefix = node.path.length ? node.path.join("/") + "/" : "";
  return Object.keys(drafts).filter(k => k.startsWith(prefix)).length;
}

/* Resolve hash path segments to a tree node; the last segment may name
   an image inside that folder (deep link to the viewer). */
function resolveHash(parts) {
  let node = state.tree;
  for (let i = 0; i < parts.length; i++) {
    const next = node.children.get(parts[i]);
    if (next) { node = next; continue; }
    if (i === parts.length - 1 && node.folder) {
      const idx = node.folder.images.findIndex(im => im.name === parts[i]);
      if (idx >= 0) return { node, imageIdx: idx };
    }
    return { node: state.tree, imageIdx: -1 };
  }
  return { node, imageIdx: -1 };
}

/* =============================================================
   Navigation (hash-based, so back/forward buttons work and
   folder/image links — including zoom state — are shareable)
   ============================================================= */
function navigate(node) {
  location.hash = "/" + node.path.map(encodeURIComponent).join("/");
}

function onHashChange() {
  const [pathPart, query] = location.hash.replace(/^#\/?/, "").split("?");
  const parts = pathPart.split("/").filter(Boolean).map(decodeURIComponent);
  const { node, imageIdx } = resolveHash(parts);
  state.node = node;
  state.page = imageIdx >= 0 ? Math.floor(imageIdx / state.pageSize) : 0;
  if (imageIdx < 0) closeViewer();
  render();
  if (imageIdx >= 0) {
    const params = new URLSearchParams(query || "");
    pendingView = {
      z: parseFloat(params.get("z")) || 1,
      x: parseFloat(params.get("x")) || 0,
      y: parseFloat(params.get("y")) || 0,
    };
    openViewer(imageIdx);
  }
}

/* =============================================================
   Rendering
   ============================================================= */
function render() {
  renderCrumbs();
  const node = state.node;
  if (node.children.size > 0) {
    $("toolbar").hidden = true;
    renderCards(node);
  } else if (node.folder) {
    $("toolbar").hidden = false;
    renderGrid(node.folder);
  } else {
    $("toolbar").hidden = true;
    $("content").innerHTML = `<div class="notice">This folder is empty.</div>`;
  }
}

function renderCrumbs() {
  const crumbs = $("crumbs");
  crumbs.innerHTML = "";
  const chain = [];
  for (let n = state.node; n; n = n.parent) chain.unshift(n);
  chain.forEach((n, i) => {
    if (i > 0) {
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = "›";
      crumbs.appendChild(sep);
    }
    if (n === state.node) {
      const here = document.createElement("span");
      here.className = "here";
      here.textContent = n.name;
      crumbs.appendChild(here);
    } else {
      const a = document.createElement("a");
      a.href = "#/" + n.path.map(encodeURIComponent).join("/");
      a.textContent = n.name;
      crumbs.appendChild(a);
    }
  });
}

const INTRO_HTML = `
  <img class="banner" src="fake_elephant.jpg" alt="Aerial view of an elephant">
  <div class="body">
  <h1>Aerial Animals — a shared dataset in the making</h1>
  <p>Aerial images of animals, collected by student teams and pooled across
     <strong>years</strong> and <strong>teams</strong>. The idea is simple: instead of every
     team starting from zero, browse what earlier teams captured, get a feel for what this
     data really looks like — lighting, altitude, how small the animals are — and use that
     to build more interesting detectors.</p>
  <p><strong id="cov-text"></strong></p>
  <div class="prog"><div id="cov-fill" style="width:0%"></div></div>
  <p style="margin-top:14px">Pick a year below, then a team and a capture session, to browse the raw images.</p>
  <p>You can help label the data too: open an image, press <strong>A</strong>, and draw
     bounding boxes around animals. Contributions of new capture folders and annotations
     are welcome — see the
     <a href="https://github.com/taxfromdk/aerial_animals" style="color:var(--accent)">repository</a>
     for how.</p>
  </div>`;

function renderCards(node) {
  const frag = document.createDocumentFragment();
  if (!node.parent) {
    const intro = document.createElement("div");
    intro.className = "intro";
    intro.innerHTML = INTRO_HTML;
    const pct = node.count ? Math.round(100 * node.annotated / node.count) : 0;
    let cov = `Annotation coverage: ${node.annotated} of ${node.count} images (${pct}%)`
      + ` · ${node.boxes} animal box${node.boxes === 1 ? "" : "es"}`
      + ` · ${node.empty} marked empty`;
    const nDrafts = draftCountFor(node);
    if (nDrafts) cov += ` · +${nDrafts} draft${nDrafts > 1 ? "s" : ""} in this browser`;
    intro.querySelector("#cov-text").textContent = cov;
    intro.querySelector("#cov-fill").style.width = pct + "%";
    frag.appendChild(intro);
  }
  const wrap = document.createElement("div");
  wrap.className = "cards";
  for (const child of node.children.values()) {
    const card = document.createElement("div");
    card.className = "card";
    const isLeaf = child.children.size === 0;
    const pct = child.count ? Math.round(100 * child.annotated / child.count) : 0;
    const sub = (isLeaf ? `${child.count} images` : `${child.children.size} folders · ${child.count} images`)
      + ` · ${pct}% annotated`;
    card.innerHTML = `<div class="icon"></div><div class="body"><div class="title"></div>
      <div class="sub"></div><div class="prog"><div></div></div></div>`;
    card.querySelector(".icon").textContent = isLeaf ? "🖼️" : "📁";
    card.querySelector(".title").textContent = child.name;
    card.querySelector(".sub").textContent = sub;
    card.querySelector(".prog > div").style.width = pct + "%";
    card.onclick = () => navigate(child);
    wrap.appendChild(card);
  }
  frag.appendChild(wrap);
  $("content").replaceChildren(frag);
  $("content").scrollTop = 0;
}

function formatSize(bytes) {
  if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
  if (bytes >= 1024) return Math.round(bytes / 1024) + " KB";
  return bytes + " B";
}

const HOVER_DELAY_MS = 200;

function makeTile(folder, image, absoluteIdx) {
  const url = thumbUrl(folder, image.name);
  const tile = document.createElement("div");
  tile.className = "tile";
  tile.innerHTML = `
    <div class="icon">🖼️</div>
    <div class="spinner"></div>
    <div class="fname"></div>
    <div class="fsize"></div>
    <div class="hover-hint">hover to preview</div>`;
  tile.querySelector(".fname").textContent = image.name;
  tile.querySelector(".fsize").textContent = formatSize(image.size);

  const draft = drafts[relPath(folder, image.name)];
  if (draft || image.ann !== undefined) {
    const n = draft ? draft.boxes.length : Number(image.ann);
    tile.classList.add(n > 0 ? "ann-boxes" : "ann-empty");
    if (draft) tile.classList.add("ann-draft");
    if (draft && image.ann !== undefined) tile.classList.add("ann-conflict");
    tile.title = (n > 0 ? `${n} animal${n > 1 ? "s" : ""}` : "reviewed, empty")
      + (draft
        ? (image.ann !== undefined
          ? " · draft, overrides repo file when committed"
          : " · draft (not committed)")
        : " · in repo");
    if (n > 0) {
      const badge = document.createElement("div");
      badge.className = "badge";
      badge.textContent = (draft ? "✎ " : "") + n;
      tile.appendChild(badge);
    }
  }

  let started = false;
  const startLoad = () => {
    if (started) return;
    started = true;
    tile.classList.add("loading");
    queueLoad(url,
      () => {
        const img = document.createElement("img");
        img.src = url;          // instant: just fetched, served from cache
        img.alt = image.name;
        tile.prepend(img);
        tile.classList.remove("loading");
        tile.classList.add("loaded");
      },
      () => {
        tile.classList.remove("loading");
        tile.classList.add("error");
        started = false;        // allow retry on next hover
      });
  };
  tile.dataset.load = "";       // marker for the "load page" button
  tile._startLoad = startLoad;

  if (state.thumbBase || loadedSet.has(url)) {
    // thumbnails are tiny — load them all (still throttled by the queue);
    // hover-loading is only for local browsing where tiles are the originals
    startLoad();
  } else {
    let timer = null;
    tile.addEventListener("mouseenter", () => {
      if (!started) timer = setTimeout(startLoad, HOVER_DELAY_MS);
    });
    tile.addEventListener("mouseleave", () => clearTimeout(timer));
  }

  tile.onclick = () => openViewer(absoluteIdx);
  return tile;
}

function pageCount(folder) {
  return Math.max(1, Math.ceil(folder.images.length / state.pageSize));
}

function renderGrid(folder) {
  const grid = document.createElement("div");
  grid.className = "grid";
  const start = state.page * state.pageSize;
  const slice = folder.images.slice(start, start + state.pageSize);
  slice.forEach((image, i) => grid.appendChild(makeTile(folder, image, start + i)));
  $("content").replaceChildren(grid);
  $("content").scrollTop = 0;

  $("page-info").textContent =
    `${start + 1}–${Math.min(start + state.pageSize, folder.images.length)} of ${folder.images.length}`;
  $("page-prev").disabled = state.page === 0;
  $("page-next").disabled = state.page >= pageCount(folder) - 1;

  const stats = folderStats(folder);
  const nDrafts = draftCountFor(state.node);
  $("coverage").textContent =
    `${stats.annotated}/${folder.images.length} annotated`
    + (nDrafts ? ` · ${nDrafts} draft${nDrafts > 1 ? "s" : ""}` : "");
}

function setPage(p) {
  const folder = state.node.folder;
  if (!folder) return;
  const clamped = Math.min(Math.max(p, 0), pageCount(folder) - 1);
  if (clamped === state.page) return;
  state.page = clamped;
  renderGrid(folder);
}

$("page-prev").onclick = () => setPage(state.page - 1);
$("page-next").onclick = () => setPage(state.page + 1);
$("page-size").onchange = e => {
  const firstVisible = state.page * state.pageSize;
  state.pageSize = parseInt(e.target.value, 10);
  state.page = Math.floor(firstVisible / state.pageSize);
  if (state.node.folder) renderGrid(state.node.folder);
};
$("load-page").onclick = () => {
  document.querySelectorAll(".tile[data-load]").forEach(t => t._startLoad());
};

/* =============================================================
   Viewer (full-size, zoom & pan)
   ============================================================= */
const vImg = $("v-img");
const vStage = document.querySelector("#viewer .stage");
let zoom = 1, panX = 0, panY = 0;
let pendingView = null;   // zoom/pan from a shared deep link, applied on image load
const MIN_ZOOM = 1, MAX_ZOOM = 12, PAN_STEP = 120;

/* Keep the address bar in sync with the open image and its zoom state,
   so the current view can be shared by copying the URL. replaceState
   avoids flooding the browser history. */
function viewerHash() {
  const folder = state.node.folder;
  const image = folder.images[state.viewerIdx];
  let h = "#/" + [...state.node.path, image.name].map(encodeURIComponent).join("/");
  if (zoom > 1) h += `?z=${zoom.toFixed(2)}&x=${Math.round(panX)}&y=${Math.round(panY)}`;
  return h;
}

let urlSyncTimer = null;
function scheduleUrlSync() {
  clearTimeout(urlSyncTimer);
  urlSyncTimer = setTimeout(() => {
    if (state.viewerIdx >= 0) history.replaceState(null, "", viewerHash());
  }, 200);
}

function openViewer(idx) {
  state.viewerIdx = idx;
  $("viewer").classList.add("open");
  showViewerImage();
}

function closeViewer() {
  const wasOpen = state.viewerIdx >= 0;
  state.viewerIdx = -1;
  clearTimeout(urlSyncTimer);
  resetZoom();
  $("viewer").classList.remove("open");
  vImg.removeAttribute("src");
  syncOverlay();
  if (wasOpen) {
    history.replaceState(null, "",
      "#/" + state.node.path.map(encodeURIComponent).join("/"));
    if (state.node.folder) renderGrid(state.node.folder);   // refresh badges
  }
}

function showViewerImage() {
  const folder = state.node.folder;
  const image = folder.images[state.viewerIdx];
  const url = fullUrl(folder, image.name);
  resetZoom();
  $("viewer").classList.add("busy");
  vImg.removeAttribute("src");
  vImg.onload = () => {
    $("viewer").classList.remove("busy");
    markLoaded(url);
    syncOverlay();
    renderBoxes();
    preloadViewerNeighbors();
    if (pendingView) {
      zoom = Math.min(Math.max(pendingView.z, MIN_ZOOM), MAX_ZOOM);
      panX = pendingView.x;
      panY = pendingView.y;
      pendingView = null;
      clampPan();
      applyTransform();
    }
    // reflect it in the grid if that tile is on screen as a placeholder
    document.querySelectorAll(".tile[data-load]:not(.loaded)").forEach(t => {
      if (t.querySelector(".fname").textContent === image.name) t._startLoad();
    });
  };
  vImg.src = url;
  $("v-orig").href = url;
  $("v-title").textContent = (folder.path ? folder.path + "/" : "") + image.name;
  $("v-pos").textContent = `${state.viewerIdx + 1} / ${folder.images.length} · ${formatSize(image.size)}`;
  syncOverlay();
  loadAnnotations(folder, image);
  scheduleUrlSync();
}

/* Warm the cache for the neighboring images once the current one is
   shown, so Prev/Next feel instant. Goes through the throttled queue. */
const preloading = new Set();
function preloadViewerNeighbors() {
  const folder = state.node.folder;
  if (!folder || state.viewerIdx < 0) return;
  const n = folder.images.length;
  for (const delta of [1, -1]) {
    const image = folder.images[(state.viewerIdx + delta + n) % n];
    const url = fullUrl(folder, image.name);
    if (!loadedSet.has(url) && !preloading.has(url)) {
      preloading.add(url);
      queueLoad(url, () => preloading.delete(url), () => preloading.delete(url));
    }
  }
}

function stepViewer(delta) {
  if (state.viewerIdx < 0) return;
  const n = state.node.folder.images.length;
  state.viewerIdx = (state.viewerIdx + delta + n) % n;
  showViewerImage();
  const vPage = Math.floor(state.viewerIdx / state.pageSize);
  if (vPage !== state.page) {
    state.page = vPage;
    renderGrid(state.node.folder);
  }
}

/* ----- zoom & pan ----- */
function applyTransform() {
  vImg.style.transform = zoom === 1 ? "" : `translate(${panX}px, ${panY}px) scale(${zoom})`;
  $("viewer").classList.toggle("zoomed", zoom > 1);
  $("v-zoom").textContent = zoom > 1 ? `${zoom.toFixed(1)}×` : "";
  syncOverlay();
  scheduleUrlSync();
  $("v-hint").textContent = zoom > 1
    ? "Shift+drag/arrows pan · scroll zoom · 0 fit · Esc fit"
    : "← → navigate · scroll/double-click zoom · Esc close";
}

function clampPan() {
  const maxX = Math.max(0, (vImg.clientWidth * zoom - vStage.clientWidth) / 2) + 40;
  const maxY = Math.max(0, (vImg.clientHeight * zoom - vStage.clientHeight) / 2) + 40;
  panX = Math.min(Math.max(panX, -maxX), maxX);
  panY = Math.min(Math.max(panY, -maxY), maxY);
}

function resetZoom() {
  zoom = 1; panX = 0; panY = 0;
  applyTransform();
}

function setZoom(newZoom, cx = 0, cy = 0) {
  newZoom = Math.min(Math.max(newZoom, MIN_ZOOM), MAX_ZOOM);
  if (newZoom === 1) return resetZoom();
  panX = cx - (cx - panX) * (newZoom / zoom);
  panY = cy - (cy - panY) * (newZoom / zoom);
  zoom = newZoom;
  clampPan();
  applyTransform();
}

function stageCoords(e) {
  const r = vStage.getBoundingClientRect();
  return [e.clientX - r.left - r.width / 2, e.clientY - r.top - r.height / 2];
}

vStage.addEventListener("wheel", e => {
  e.preventDefault();
  setZoom(zoom * (e.deltaY < 0 ? 1.25 : 0.8), ...stageCoords(e));
}, { passive: false });

/* double-click zooms; attached to the overlay since it sits above the image */

/* =============================================================
   Annotations — YOLO-style normalized boxes (x/y = center).
   Committed truth: <image>.json sidecar files in the repo.
   Working copy: localStorage drafts, exported as a zip whose
   folder structure mirrors the repo for easy merging.
   ============================================================= */
/* Single class for now; add entries here to extend (labels are stored
   by name in the JSON, so old annotations stay valid). */
const CLASSES = [
  { name: "animal", color: "#f0a63a" },
];
const SVGNS = "http://www.w3.org/2000/svg";
const vOverlay = $("v-overlay");

let currentClass = 0;
let selectedBox = -1;
let viewerBoxes = null;    // working copy for the open image (null = not annotated)
let viewerSource = null;   // 'draft' | 'repo' | null
let viewerHasRepo = false; // a committed sidecar exists for the open image
let annLoadToken = 0;

const DRAFTS_KEY = "gallery-ann-drafts-v1";
const drafts = JSON.parse(localStorage.getItem(DRAFTS_KEY) || "{}");

function relPath(folder, name) {
  return (folder.path ? folder.path + "/" : "") + name;
}

function saveDrafts() {
  localStorage.setItem(DRAFTS_KEY, JSON.stringify(drafts));
  updateDraftInfo();
}

function updateDraftInfo() {
  const n = Object.keys(drafts).length;
  $("draft-info").textContent =
    n ? `${n} draft annotation file${n > 1 ? "s" : ""} in this browser` : "";
  $("dl-zip").hidden = !n;
  $("clear-drafts").hidden = !n;
}

const repoAnnCache = new Map();
async function fetchRepoAnn(rp) {
  if (repoAnnCache.has(rp)) return repoAnnCache.get(rp);
  let val = null;
  try {
    const r = await fetch(rp.split("/").map(encodeURIComponent).join("/") + ".json",
                          { cache: "no-store" });
    if (r.ok) val = await r.json();
  } catch { /* treated as unannotated */ }
  repoAnnCache.set(rp, val);
  return val;
}

async function loadAnnotations(folder, image) {
  const token = ++annLoadToken;
  const rp = relPath(folder, image.name);
  selectedBox = -1;
  viewerHasRepo = image.ann !== undefined;
  const draft = drafts[rp];
  if (draft) {
    viewerBoxes = JSON.parse(JSON.stringify(draft.boxes));
    viewerSource = "draft";
    renderBoxes();
    return;
  }
  viewerBoxes = null;
  viewerSource = null;
  renderBoxes();
  if (!image.ann) return;
  const repo = await fetchRepoAnn(rp);
  if (token !== annLoadToken) return;      // user moved to another image
  if (Array.isArray(repo)) {
    viewerBoxes = JSON.parse(JSON.stringify(repo));
    viewerSource = "repo";
  }
  renderBoxes();
}

function commitBoxes() {
  const folder = state.node.folder;
  const image = folder.images[state.viewerIdx];
  const rounded = viewerBoxes.map(b => ({
    label: b.label,
    x: +b.x.toFixed(4), y: +b.y.toFixed(4),
    w: +b.w.toFixed(4), h: +b.h.toFixed(4),
  }));
  drafts[relPath(folder, image.name)] = { boxes: rounded, t: Date.now() };
  viewerBoxes = rounded;
  viewerSource = "draft";
  saveDrafts();
  renderBoxes();
}

/* Overlay tracks the (possibly zoomed/panned) image exactly */
function syncOverlay() {
  if (state.viewerIdx < 0 || !vImg.naturalWidth || !vImg.getAttribute("src")) {
    vOverlay.style.display = "none";
    return;
  }
  const sr = vStage.getBoundingClientRect();
  const ir = vImg.getBoundingClientRect();
  vOverlay.style.display = "";
  vOverlay.style.left = (ir.left - sr.left) + "px";
  vOverlay.style.top = (ir.top - sr.top) + "px";
  vOverlay.style.width = ir.width + "px";
  vOverlay.style.height = ir.height + "px";
  vOverlay.setAttribute("viewBox", `0 0 ${vImg.naturalWidth} ${vImg.naturalHeight}`);
  vOverlay.setAttribute("preserveAspectRatio", "none");
}

function renderBoxes(rubber) {
  while (vOverlay.firstChild) vOverlay.removeChild(vOverlay.firstChild);
  const W = vImg.naturalWidth || 1, H = vImg.naturalHeight || 1;
  (viewerBoxes || []).forEach((b, i) => {
    const cls = CLASSES.find(c => c.name === b.label) || CLASSES[0];
    const r = document.createElementNS(SVGNS, "rect");
    r.setAttribute("x", (b.x - b.w / 2) * W);
    r.setAttribute("y", (b.y - b.h / 2) * H);
    r.setAttribute("width", b.w * W);
    r.setAttribute("height", b.h * H);
    r.setAttribute("fill", cls.color);
    r.setAttribute("fill-opacity", i === selectedBox ? "0.25" : "0.08");
    r.setAttribute("stroke", cls.color);
    r.setAttribute("stroke-width", i === selectedBox ? 3 : 2);
    r.setAttribute("vector-effect", "non-scaling-stroke");
    r.setAttribute("pointer-events", "none");
    vOverlay.appendChild(r);
    const t = document.createElementNS(SVGNS, "text");
    t.setAttribute("x", (b.x - b.w / 2) * W);
    t.setAttribute("y", (b.y - b.h / 2) * H - H * 0.006);
    t.setAttribute("font-size", H * 0.022);
    t.setAttribute("fill", cls.color);
    t.setAttribute("pointer-events", "none");
    t.textContent = b.label;
    vOverlay.appendChild(t);
  });
  if (rubber) {
    const r = document.createElementNS(SVGNS, "rect");
    r.setAttribute("x", Math.min(rubber.x0, rubber.x1) * W);
    r.setAttribute("y", Math.min(rubber.y0, rubber.y1) * H);
    r.setAttribute("width", Math.abs(rubber.x1 - rubber.x0) * W);
    r.setAttribute("height", Math.abs(rubber.y1 - rubber.y0) * H);
    r.setAttribute("fill", "none");
    r.setAttribute("stroke", CLASSES[currentClass].color);
    r.setAttribute("stroke-width", 2);
    r.setAttribute("stroke-dasharray", "6 4");
    r.setAttribute("vector-effect", "non-scaling-stroke");
    r.setAttribute("pointer-events", "none");
    vOverlay.appendChild(r);
  }
  vOverlay.appendChild(guideH);   // guides survive re-renders, on top
  vOverlay.appendChild(guideV);
  updateAnnStatus();
}

function updateAnnStatus() {
  const status = $("ann-status");
  const src = viewerSource === "draft" && viewerHasRepo
    ? "draft, overrides repo file" : viewerSource;
  if (viewerBoxes === null) {
    status.textContent = "none";
  } else if (viewerBoxes.length === 0) {
    status.textContent = `empty (reviewed) · ${src}`;
  } else {
    status.textContent = `${viewerBoxes.length} × animal · ${src}`;
  }
  const chips = $("ann-chips");
  chips.innerHTML = "";
  (viewerBoxes || []).forEach((b, i) => {
    const cls = CLASSES.find(c => c.name === b.label) || CLASSES[0];
    const chip = document.createElement("span");
    chip.className = "chip" + (i === selectedBox ? " selected" : "");
    chip.innerHTML = `<span class="dot"></span><span class="lbl"></span><button class="x" title="remove">✕</button>`;
    chip.querySelector(".dot").style.background = cls.color;
    chip.querySelector(".lbl").textContent = b.label;
    chip.onclick = e => {
      if (e.target.classList.contains("x")) {
        selectedBox = i;
        deleteSelected();
      } else {
        selectedBox = selectedBox === i ? -1 : i;
        renderBoxes();
      }
    };
    chips.appendChild(chip);
  });
  $("v-discard").hidden = viewerSource !== "draft";
}

function deleteSelected() {
  if (selectedBox < 0 || !viewerBoxes) return;
  viewerBoxes.splice(selectedBox, 1);
  selectedBox = -1;
  commitBoxes();
}

/* ----- drawing (implicit: drag always draws; Shift/middle drag pans;
       dragging an existing box moves it) ----- */
let drawing = null;
let panDrag = null;
let moveDrag = null;

/* crosshair guide lines following the cursor, for easy box dimensioning */
const guideH = document.createElementNS(SVGNS, "line");
const guideV = document.createElementNS(SVGNS, "line");
for (const g of [guideH, guideV]) {
  g.setAttribute("stroke", "rgba(255,255,255,.5)");
  g.setAttribute("stroke-width", 1);
  g.setAttribute("vector-effect", "non-scaling-stroke");
  g.setAttribute("pointer-events", "none");
  g.style.display = "none";
}

function updateGuides(nx, ny) {
  const W = vImg.naturalWidth || 1, H = vImg.naturalHeight || 1;
  guideH.setAttribute("x1", 0);
  guideH.setAttribute("x2", W);
  guideH.setAttribute("y1", ny * H);
  guideH.setAttribute("y2", ny * H);
  guideV.setAttribute("x1", nx * W);
  guideV.setAttribute("x2", nx * W);
  guideV.setAttribute("y1", 0);
  guideV.setAttribute("y2", H);
  guideH.style.display = guideV.style.display = "";
}

function hitBox(nx, ny) {
  for (let i = (viewerBoxes || []).length - 1; i >= 0; i--) {
    const b = viewerBoxes[i];
    if (Math.abs(nx - b.x) <= b.w / 2 && Math.abs(ny - b.y) <= b.h / 2) return i;
  }
  return -1;
}

function overlayNorm(e) {
  const r = vOverlay.getBoundingClientRect();
  return [
    Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1),
    Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1),
  ];
}

vOverlay.addEventListener("dblclick", e => setZoom(zoom > 1 ? 1 : 3, ...stageCoords(e)));

vOverlay.addEventListener("pointerdown", e => {
  if (state.viewerIdx < 0) return;
  e.stopPropagation();
  if ((e.shiftKey || e.button === 1) && zoom > 1) {
    e.preventDefault();
    panDrag = { x: e.clientX, y: e.clientY };
    vOverlay.setPointerCapture(e.pointerId);
    return;
  }
  if (e.button !== 0) return;
  const [nx, ny] = overlayNorm(e);
  const hit = hitBox(nx, ny);
  if (hit >= 0) {
    // drag an existing box to move it
    selectedBox = hit;
    moveDrag = { i: hit, lx: nx, ly: ny, moved: false, sx: e.clientX, sy: e.clientY };
    renderBoxes();
  } else {
    drawing = { x0: nx, y0: ny, x1: nx, y1: ny, sx: e.clientX, sy: e.clientY };
  }
  vOverlay.setPointerCapture(e.pointerId);
});
vOverlay.addEventListener("pointermove", e => {
  const [nx, ny] = overlayNorm(e);
  updateGuides(nx, ny);
  if (panDrag) {
    panX += e.clientX - panDrag.x;
    panY += e.clientY - panDrag.y;
    panDrag = { x: e.clientX, y: e.clientY };
    clampPan();
    applyTransform();
    return;
  }
  if (moveDrag) {
    const b = viewerBoxes[moveDrag.i];
    b.x = Math.min(Math.max(b.x + nx - moveDrag.lx, b.w / 2), 1 - b.w / 2);
    b.y = Math.min(Math.max(b.y + ny - moveDrag.ly, b.h / 2), 1 - b.h / 2);
    moveDrag.lx = nx;
    moveDrag.ly = ny;
    if (Math.hypot(e.clientX - moveDrag.sx, e.clientY - moveDrag.sy) > 3) moveDrag.moved = true;
    renderBoxes();
    return;
  }
  if (!drawing) return;
  [drawing.x1, drawing.y1] = overlayNorm(e);
  renderBoxes(drawing);
});
vOverlay.addEventListener("pointerleave", () => {
  guideH.style.display = guideV.style.display = "none";
});
vOverlay.addEventListener("pointerup", e => {
  if (panDrag) {
    panDrag = null;
    vOverlay.releasePointerCapture(e.pointerId);
    return;
  }
  if (moveDrag) {
    const wasMoved = moveDrag.moved;
    moveDrag = null;
    vOverlay.releasePointerCapture(e.pointerId);
    if (wasMoved) commitBoxes();     // one save per completed move
    return;
  }
  if (!drawing) return;
  vOverlay.releasePointerCapture(e.pointerId);
  const d = drawing;
  drawing = null;
  if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 5) {
    if (!viewerBoxes) viewerBoxes = [];
    viewerBoxes.push({
      label: CLASSES[currentClass].name,
      x: (d.x0 + d.x1) / 2, y: (d.y0 + d.y1) / 2,
      w: Math.abs(d.x1 - d.x0), h: Math.abs(d.y1 - d.y0),
    });
    selectedBox = viewerBoxes.length - 1;
    commitBoxes();
  } else {
    selectedBox = -1;   // clicked empty space: deselect
    renderBoxes();
  }
});

/* ----- controls ----- */
function markEmptyAndNext() {
  if (state.viewerIdx < 0) return;
  viewerBoxes = [];
  selectedBox = -1;
  commitBoxes();
  stepViewer(1);          // review flow: empty → straight to the next image
}
$("v-empty").onclick = markEmptyAndNext;
$("v-discard").onclick = () => {
  if (state.viewerIdx < 0) return;
  const folder = state.node.folder;
  const image = folder.images[state.viewerIdx];
  delete drafts[relPath(folder, image.name)];
  saveDrafts();
  loadAnnotations(folder, image);
};
/* ----- zip export (STORE format, no dependencies) ----- */
/* ZIP-LIB-START */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(data) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < data.length; i++) c = CRC_TABLE[(c ^ data[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function makeZip(entries) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  for (const e of entries) {
    const name = enc.encode(e.name);
    const crc = crc32(e.data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);
    lh.setUint16(10, dosTime, true);
    lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, e.data.length, true);
    lh.setUint32(22, e.data.length, true);
    lh.setUint16(26, name.length, true);
    parts.push(new Uint8Array(lh.buffer), name, e.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, dosTime, true);
    ch.setUint16(14, dosDate, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, e.data.length, true);
    ch.setUint32(24, e.data.length, true);
    ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + e.data.length;
  }
  let cdSize = 0;
  for (const p of central) cdSize += p.length;
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, entries.length, true);
  eocd.setUint16(10, entries.length, true);
  eocd.setUint32(12, cdSize, true);
  eocd.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(eocd.buffer)],
                  { type: "application/zip" });
}
/* ZIP-LIB-END */

$("dl-zip").onclick = () => {
  const enc = new TextEncoder();
  const entries = Object.keys(drafts).sort().map(rp => ({
    name: rp + ".json",
    data: enc.encode(JSON.stringify(drafts[rp].boxes, null, 1) + "\n"),
  }));
  if (!entries.length) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(makeZip(entries));
  a.download = "annotations.zip";
  a.click();
  URL.revokeObjectURL(a.href);
};

$("clear-drafts").onclick = () => {
  if (!confirm("Discard ALL draft annotations stored in this browser? Committed files are unaffected.")) return;
  for (const k of Object.keys(drafts)) delete drafts[k];
  saveDrafts();
  if (state.node && state.node.folder) renderGrid(state.node.folder);
};

window.addEventListener("resize", syncOverlay);

$("v-share").onclick = async () => {
  if (state.viewerIdx < 0) return;
  history.replaceState(null, "", viewerHash());   // make sure zoom state is current
  const url = location.href;
  try {
    await navigator.clipboard.writeText(url);
    $("v-share").textContent = "Copied!";
    setTimeout(() => { $("v-share").textContent = "Copy link"; }, 1500);
  } catch {
    window.prompt("Copy this link:", url);
  }
};

$("v-close").onclick = closeViewer;
$("v-prev").onclick = () => stepViewer(-1);
$("v-next").onclick = () => stepViewer(1);
vStage.onclick = e => {
  if (e.target !== vImg && !e.target.closest("#v-overlay")) closeViewer();
};

/* =============================================================
   Keyboard
   ============================================================= */
document.addEventListener("keydown", e => {
  if (state.viewerIdx >= 0) {
    if (e.key === " ") { e.preventDefault(); return markEmptyAndNext(); }
    if (e.key === "Delete" || e.key === "Backspace") return deleteSelected();
    if (e.key === "+" || e.key === "=") return setZoom(zoom * 1.25);
    if (e.key === "-") return setZoom(zoom * 0.8);
    if (e.key === "0") return resetZoom();
    if (e.key === "PageUp") { e.preventDefault(); return stepViewer(-1); }
    if (e.key === "PageDown") { e.preventDefault(); return stepViewer(1); }
    if (e.key === "Escape") return zoom > 1 ? resetZoom() : closeViewer();
    if (zoom > 1) {
      const pan = { ArrowLeft: [PAN_STEP, 0], ArrowRight: [-PAN_STEP, 0],
                    ArrowUp: [0, PAN_STEP], ArrowDown: [0, -PAN_STEP] }[e.key];
      if (pan) {
        e.preventDefault();
        panX += pan[0];
        panY += pan[1];
        clampPan();
        applyTransform();
      }
    } else {
      if (e.key === "ArrowLeft") stepViewer(-1);
      else if (e.key === "ArrowRight") stepViewer(1);
    }
  } else if (state.node) {
    if (e.key === "ArrowLeft" || e.key === "PageUp") setPage(state.page - 1);
    else if (e.key === "ArrowRight" || e.key === "PageDown") setPage(state.page + 1);
    else if ((e.key === "Backspace" || e.key === "Escape") && state.node.parent) {
      navigate(state.node.parent);
    }
  }
});

/* =============================================================
   Boot
   ============================================================= */
fetch("index.json", { cache: "no-store" })
  .then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  })
  .then(index => {
    state.index = index;
    state.thumbBase = index.thumb_base || null;
    state.sourceBase = index.source_base || null;
    if (state.thumbBase) {
      $("load-page").hidden = true;
      document.querySelector("#toolbar .hint").textContent = "Click an image to view full size";
    }
    state.tree = buildTree(index);
    const generated = new Date(index.generated).toLocaleString();
    $("stats").textContent =
      `${index.total_images} images · ${index.total_folders} folders · indexed ${generated}`;
    updateDraftInfo();
    window.addEventListener("hashchange", onHashChange);
    onHashChange();
  })
  .catch(() => {
    $("stats").textContent = "index.json not found";
    $("content").innerHTML = `<div class="notice">Could not load <code>index.json</code>.<br><br>
      Generate it and serve the gallery with:<br><br><code>python3 run_index.py --serve</code></div>`;
  });
</script>
</body>
